name: AI Review

# AI code review via Codex, pointed at the WorkBuddy gateway.
#
# Observation mode: this job posts a review comment. It is deliberately NOT a
# required status check, so it cannot block a merge while we are still measuring
# its false-positive rate. Promote it to a gate only after reviewing the output
# on real pull requests.
#
# Runs on every pull request event, including each push (`synchronize`). A newer
# push cancels an in-flight review of the same PR, so a PR that is pushed
# repeatedly does not queue up a stack of paid reviews.
#
# Secrets: WB2API_KEY is a repository secret holding the key for the gateway in
# `responses-api-endpoint`. It is not an OpenAI-issued key. The action name says
# "openai" because it ships the Codex CLI; the endpoint override is what makes it
# talk to our provider.
#
# Fork pull requests cannot read repository secrets, so they are skipped
# explicitly and the reason is recorded in the job summary. Member PRs come from
# forks, so their reviews need to be triggered from a same-repo branch until we
# decide on a different mechanism. A skip is reported, never silent.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One review per pull request. A new push cancels the previous run rather than
  # reviewing a superseded revision.
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    # Fork PRs carry no secrets, so the review cannot authenticate. Skip them
    # instead of letting the step fail and look like a broken check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Two bounds, and they do different jobs.
    #
    # The job timeout below is the outer backstop. It is not precise: GitHub cancels
    # cooperatively, so a step blocked on an external HTTP call notices late. A
    # 30-minute limit was observed to finish at 35; a 45-minute limit was still
    # running at 55 and had to be cancelled by hand. Size it for that slack.
    #
    # The step timeout on `Run the review` is the tighter of the two, and it is the
    # one that actually bounds the review.
    #
    # Neither of those bounds does anything about *why* a review runs long. The
    # earlier failures were not the timeout: they were three reviews that spent 35,
    # 55 and 55 minutes without landing a report. The cause was the task surface
    # being far wider than the diff -- the guide's 12 highest-priority defect
    # families applied without discrimination to a diff of three Markdown files,
    # with an instruction to verify every checkable claim by running commands.
    # That is now fixed in the prompt and the guide, which route the review by diff
    # type and forbid long command runs on documentation.
    #
    # For the case where the agent still over-explores, `codex-home` carries a token
    # budget. Codex has no --max-turns (unlike Claude Code Action's `--max-turns`),
    # but it does expose a hard token budget that aborts the session with
    # `SessionBudgetExceeded` when exhausted. See the config below.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base ref for the diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"

      - name: Write the Codex config
        # `approval_policy = "never"` is not what fixed the hang -- the pinned
        # action version did. It is here because it is the other half of the
        # read-only setup and was missing.
        #
        # `permission-profile: ":read-only"` constrains the filesystem and the
        # network; it does not set an approval policy, and Codex's default is
        # `on-request`, meaning the model may ask a human to approve a command. In
        # CI there is no human. OpenAI's own CI configuration pairs
        # `approval_policy = "never"` with a read-only sandbox rather than relying
        # on the default. `never` does not hang when there is nothing to fall back
        # on -- it rejects the command and returns the failure to the model, which
        # then has to work with what it has.
        #
        # This goes through `codex-home` rather than `codex-args`: codex-action
        # lists `approval_policy` in RESTRICTED_CONFIG_ROOTS and rejects it as a
        # `-c` override on a protected run.
        #
        # It is also load-bearing on this runner for a second reason. Codex logs
        # `warning: Codex could not find bubblewrap on PATH` here, which means the
        # sandbox backend is absent, and the read-only policy then falls back to
        # requiring approval for commands. `never` is the setting that makes that
        # path reject-and-continue instead of waiting for an approver who does not
        # exist. If bubblewrap is ever installed on the runner, this stays correct;
        # it is only the fallback behaviour that changes.
        #
        # The token budget is the other half of this file, and it is a backstop
        # rather than the primary control -- the prompt and the guide narrow the
        # task. It aborts the session with `SessionBudgetExceeded` once weighted
        # spend reaches `limit_tokens`, and it cannot be resumed past that:
        # `record_usage` returns exhausted on every later call, not only on the one
        # that crossed.
        #
        # The limit is now measured rather than guessed. At 600k, a real review of
        # this pull request ended at 602,575 tokens -- it fired exactly as designed,
        # 0.4% past the limit, and confirmed both that the mechanism works and that
        # 600k is simply below what one review of this diff costs. It stopped the
        # run before a report landed, which is a safe failure but not a useful one.
        #
        # Raised to 1.5M so that a report lands and the real cost becomes visible.
        # The point of a budget here is to bound a runaway, not to force early
        # termination of a working review. Watch the next runs:
        #
        #   - if reviews land comfortably under the limit, lower it toward the
        #     observed cost, so it stays a real bound rather than decoration;
        #   - if a review is still cut off while producing signal, raise it again.
        #
        # Expect the cost to come down on its own once the task surface narrows
        # further: the run above read the guide in four separate slices, plus
        # PROJECT.md and the task ledger, neither of which the prompt asks for.
        #
        # The reminders are the softer half of the budget: they inject a reminder
        # into the model's context while there is still room, so the agent gets a
        # chance to land its report rather than be cut off mid-investigation. 400k
        # remaining is the first warning, 150k the second.
        #
        # The directory lives outside the checkout on purpose. The review runs
        # with a read-only permission profile, and Codex also writes session and
        # cache files under CODEX_HOME, so pointing this at a path inside the
        # read-only tree would be asking for a write failure. `/tmp` is writable
        # and is not part of what is under review.
        run: |
          set -euo pipefail
          mkdir -p /tmp/codex-home
          cat > /tmp/codex-home/config.toml <<'TOML'
          approval_policy = "never"

          [features.rollout_budget]
          enabled = true
          limit_tokens = 1500000
          reminder_at_remaining_tokens = [400000, 150000]
          TOML

      - name: Run the review
        id: review
        # The tighter of the two time bounds. This alone was NOT enough: a
        # 25-minute step timeout on this step let a run reach 55 minutes, because
        # the hang is in the action wrapper and not in Codex. See the note on the
        # pinned version below.
        timeout-minutes: 25
        # Pinned to v1.11 rather than `@v1`. `@v1` and v1.12 are the same commit
        # (86365089), and v1.12 has a wrapper lifecycle bug that matches this job's
        # symptoms exactly -- openai/codex-action#169 reports 33 of 39 reviews
        # stuck until the job timeout, with the identical configuration
        # (ubuntu-latest, max effort, drop-sudo, :read-only). The reported shape:
        # Codex prints its final JSON and token count, then the action never exits
        # or emits its end marker.
        #
        # The mechanism is in v1.12's process handling: it spawns with inherited
        # stdout/stderr and waits on the child's `close` event, so a descendant
        # that keeps those descriptors open holds the action alive after the direct
        # child has finished. That is why nothing else here helps. The token budget
        # never fires (the model is done spending), the step timeout is cooperative
        # and the wrapper is not cooperating, and the elapsed time is constant
        # rather than proportional to the work. The fix upstream is
        # openai/codex-action#151 (private pipes, complete on `exit`), which is
        # still open and unreleased as of this pin.
        #
        # v1.11 is known-good for this: openai/codex-action#150 reports it
        # completing cleanly where v1.12 spins after printing tokens. It supports
        # both `permission-profile` and `codex-home`, so nothing else here changes.
        # Revisit the pin once #151 ships.
        uses: openai/codex-action@v1.11
        env:
          # Interpolated by the prompt so the reviewer can build the diff itself.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          # The gateway key, not an OpenAI key.
          openai-api-key: ${{ secrets.WB2API_KEY }}
          # Full URL including the /v1/responses suffix. This is the documented
          # shape for a non-default Responses endpoint, and it is how the action
          # is pointed at a third-party provider.
          responses-api-endpoint: "https://workbuddy2api.henryai.top/v1/responses"
          model: glm-5.3
          # The gateway's GLM-5.3 accepts low/high/max. `medium` is not an
          # official level and was observed to be accepted-but-inert, so it is
          # not used. `max` is the level the vendor recommends for reasoning and
          # coding work.
          #
          # max stays. Latency is acceptable when the output is worth it; what was
          # wrong before was not the depth but the width of the task. The prompt
          # and the guide narrow the task, so max has less to wander through.
          #
          # Caveat, observed in the run logs: Codex does not recognise this model.
          # It logs `warning: Model metadata for glm-5.3 not found. Defaulting to
          # fallback metadata; this can degrade performance and cause issues.` The
          # value is accepted and the session reports `reasoning effort: max`, but
          # with `glm-5.3` absent from Codex's model table there is no guarantee the
          # effort mapping is the one this setting is supposed to select. Treat the
          # reasoning level as configured-but-unverified until the gateway serves a
          # model Codex has metadata for.
          effort: max
          # Read-only: the reviewer must not be able to modify the branch under
          # review. Note this profile requires Codex CLI >= 0.138.0, which is why
          # `codex-version` is deliberately left unpinned.
          permission-profile: ":read-only"
          prompt-file: .ai-team/ai-review-prompt.md
          # The budget config written above. This is the documented way to run
          # codex with settings the action does not expose as inputs.
          codex-home: /tmp/codex-home

      - name: Post the review as a comment
        if: steps.review.outputs.final-message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BODY: ${{ steps.review.outputs.final-message }}
        run: |
          set -euo pipefail
          {
            echo "## AI review (Codex + GLM-5.3)"
            echo
            echo "_Observation mode: advisory only, not a required check._"
            echo
            echo "$REVIEW_BODY"
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md

  # Records why a fork PR received no review, so the absence is visible rather
  # than looking like a job that silently did nothing.
  skip-notice:
    name: AI review (skipped)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          {
            echo "### AI review skipped"
            echo
            echo "This pull request comes from a fork, so the repository secret"
            echo "\`WB2API_KEY\` is unavailable and the review cannot authenticate."
            echo
            echo "To review it, a maintainer can check out the branch in this"
            echo "repository and open a same-repo pull request, or run the review"
            echo "locally. This is a limitation of GitHub's secret handling for"
            echo "fork pull requests, not a failure of the workflow."
          } >> "$GITHUB_STEP_SUMMARY"
