name: AutoResearch PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: autoresearch-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Compile
        run: python -m compileall -q src

      - name: Tests
        run: python -m pytest -W error -q

  task-contract:
    name: Task contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PR/task contract
        run: python scripts/check_pr_contract.py --base "${{ github.event.pull_request.base.sha }}"
